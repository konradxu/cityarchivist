<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alinas Geburtstag 🎉</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 30% 20%, #2a0a3e 0%, #0a0014 50%, #000 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: safe center;
    padding: 24px 20px;
    user-select: none;
    overflow-x: hidden;
  }

  .screen { display: none; width: 100%; max-width: 720px; }
  .screen.active { display: flex; flex-direction: column; align-items: center; }

  h1 {
    font-size: clamp(2rem, 6vw, 3.5rem);
    background: linear-gradient(90deg, #ff3df0, #ff6b6b, #ffd93d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
    text-align: center;
    font-weight: 900;
    letter-spacing: -1px;
  }
  .subtitle { color: #aaa; margin-bottom: 32px; text-align: center; font-size: 0.95rem; }

  /* Setup */
  .setup-form { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 380px; }
  .player-input {
    background: rgba(255,255,255,0.06);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 16px 20px;
    color: #fff;
    font-size: 1.05rem;
    outline: none;
    transition: all .2s;
  }
  .player-input:focus { border-color: #ff3df0; background: rgba(255,61,240,0.08); }
  .player-input::placeholder { color: #777; }

  .btn {
    background: linear-gradient(135deg, #ff3df0, #ff6b6b);
    color: #fff;
    border: none;
    padding: 16px 36px;
    border-radius: 14px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform .15s, box-shadow .2s;
    box-shadow: 0 8px 24px rgba(255,61,240,0.35);
    margin-top: 12px;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(255,61,240,0.5); }
  .btn:active { transform: translateY(0); }
  .btn-ghost {
    background: rgba(255,255,255,0.08);
    box-shadow: none;
    margin-top: 8px;
  }
  .btn-ghost:hover { background: rgba(255,255,255,0.14); box-shadow: none; }

  /* Game board */
  .board-wrap {
    position: relative;
    width: min(92vw, 480px);
    height: min(92vw, 480px);
    margin: 16px 0;
  }
  .board {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,61,240,0.15) 0%, rgba(0,0,0,0.4) 70%);
    border: 2px solid rgba(255,255,255,0.15);
    box-shadow: inset 0 0 60px rgba(255,61,240,0.2), 0 0 80px rgba(255,61,240,0.15);
  }
  .player-label {
    position: absolute;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255,255,255,0.2);
    padding: 10px 18px;
    border-radius: 24px;
    font-weight: 700;
    font-size: 0.95rem;
    transform: translate(-50%, -50%);
    transition: all .3s;
    white-space: nowrap;
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .player-label.highlight {
    background: linear-gradient(135deg, #ff3df0, #ffd93d);
    border-color: #fff;
    transform: translate(-50%, -50%) scale(1.15);
    box-shadow: 0 0 30px rgba(255,61,240,0.8);
  }

  .bottle {
    position: absolute;
    top: 50%; left: 50%;
    width: 50px;
    height: 60%;
    transform: translate(-50%, -50%) rotate(0deg);
    transition: transform 4.5s cubic-bezier(0.17, 0.67, 0.21, 1);
    transform-origin: center center;
    pointer-events: none;
  }
  .bottle svg { width: 100%; height: 100%; filter: drop-shadow(0 4px 16px rgba(0,0,0,0.6)); }

  .spin-btn {
    background: linear-gradient(135deg, #ffd93d, #ff6b6b);
    box-shadow: 0 8px 24px rgba(255,107,107,0.4);
  }
  .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Card overlay */
  .card-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(10px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .card-overlay.active { display: flex; }

  .card-scene {
    width: min(88vw, 360px);
    height: min(120vw, 500px);
    max-height: 80vh;
    perspective: 1500px;
  }
  .card {
    position: relative;
    width: 100%; height: 100%;
    transform-style: preserve-3d;
    transform: rotateY(180deg);
    transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .card.flipped { transform: rotateY(0deg); }
  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 22px;
    padding: 30px 24px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .card-back {
    background: linear-gradient(135deg, #2a0a3e, #6b1a8a);
    border: 2px solid rgba(255,61,240,0.4);
    transform: rotateY(180deg);
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .card-back::before {
    content: "";
    position: absolute;
    inset: 12px;
    border-radius: 16px;
    border: 2px dashed rgba(255,255,255,0.2);
  }
  .card-back-logo {
    font-size: 4rem;
    margin-bottom: 12px;
    animation: pulse 1.5s ease-in-out infinite;
  }
  .card-back-text {
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: 2px;
    color: #ffd93d;
  }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.1);} }

  .card-front {
    background: linear-gradient(160deg, #1a0033, #3d0066);
    border: 2px solid rgba(255,255,255,0.15);
    justify-content: space-between;
  }
  .card-category {
    font-size: 0.85rem;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.7;
  }
  .card-player {
    font-size: 1.8rem;
    font-weight: 900;
    background: linear-gradient(90deg, #ff3df0, #ffd93d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 8px 0 18px;
    line-height: 1.1;
    word-break: break-word;
  }
  .card-task {
    flex: 1;
    display: flex;
    align-items: center;
    font-size: 1.2rem;
    line-height: 1.45;
    font-weight: 500;
  }
  .card-emoji { font-size: 2.5rem; margin-bottom: 8px; }

  .card-penalty {
    background: linear-gradient(135deg, rgba(255,61,61,0.18), rgba(255,107,107,0.1));
    border: 1px solid rgba(255,107,107,0.4);
    border-radius: 12px;
    padding: 10px 14px;
    margin-top: 14px;
    font-size: 0.95rem;
    line-height: 1.3;
    display: flex;
    gap: 8px;
    align-items: baseline;
    flex-wrap: wrap;
  }
  .penalty-label {
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #ff8a8a;
  }
  #cardSkip { color: #ffe9a8; font-weight: 600; }

  .card-actions { display: flex; gap: 10px; margin-top: 16px; }
  .card-actions .btn { flex: 1; margin: 0; padding: 14px 16px; font-size: 0.95rem; }

  .player-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
    margin-bottom: 12px;
  }
  .player-row .player-input { flex: 1; margin: 0; }
  .remove-btn {
    background: rgba(255,107,107,0.12);
    border: 2px solid rgba(255,107,107,0.3);
    color: #ff8a8a;
    border-radius: 14px;
    width: 52px;
    font-size: 1.1rem;
    cursor: pointer;
    transition: all .15s;
  }
  .remove-btn:hover { background: rgba(255,107,107,0.25); color: #fff; }

  .secret-dot {
    position: fixed;
    bottom: 10px;
    right: 10px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    z-index: 50;
    cursor: pointer;
    transition: all .25s;
  }
  .secret-dot:hover { background: rgba(255,255,255,0.12); }
  .secret-dot.on {
    background: #ff3df0;
    border-color: #fff;
    box-shadow: 0 0 14px rgba(255,61,240,0.8);
  }
  .spicy-toast {
    position: fixed;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.9);
    color: #ffd93d;
    padding: 10px 20px;
    border-radius: 22px;
    font-weight: 700;
    font-size: 0.9rem;
    z-index: 300;
    border: 1px solid rgba(255,61,240,0.5);
    animation: toastIn .25s ease-out;
    pointer-events: none;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(8px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  .footer-bar {
    display: flex;
    gap: 10px;
    margin-top: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .pill {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 0.8rem;
    color: #aaa;
    cursor: pointer;
    transition: all .15s;
  }
  .pill:hover { background: rgba(255,255,255,0.12); color: #fff; }
  .pill.on { background: linear-gradient(135deg, #ff3df0, #ff6b6b); border-color: transparent; color: #fff; }

  .counter {
    position: absolute;
    top: 16px; right: 16px;
    background: rgba(0,0,0,0.5);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.85rem;
    color: #ffd93d;
    font-weight: 700;
  }
</style>
</head>

<!-- Setup -->
<div class="screen active" id="setupScreen">

    <button class="btn" type="button" onclick="startGame()">Spiel starten</button>
  </div>
</div>

<!-- Geheimer Spicy-Toggle -->
<div class="secret-dot" id="secretDot" onclick="toggleSpicy()"></div>

<!-- Spiel -->

      </svg>
    </div>
  </div>
  <button class="btn spin-btn" id="spinBtn" onclick="spin()">🌀 Drehen</button>
  <button class="btn btn-ghost" onclick="resetGame()">Neues Spiel</button>
</div>

<!-- Karten-Overlay -->
<div class="card-overlay" id="cardOverlay">
  <div class="card-scene">
    <div class="card" id="card">
      <div class="card-face card-back">

let isSpinning = false;
let round = 0;
let spicyBoost = false;

const MIN_PLAYERS = 2;
const MAX_PLAYERS = 8;
let playerNames = ["Anna", "Ben", "Lisa", "Max"];

function renderPlayers() {
  const list = document.getElementById("playerList");
  list.innerHTML = "";
  playerNames.forEach((name, i) => {
    const row = document.createElement("div");
    row.className = "player-row";
    const input = document.createElement("input");
    input.className = "player-input";
    input.placeholder = "Spieler " + (i + 1);
    input.maxLength = 14;
    input.value = name;
    input.id = "p" + (i + 1);
    input.addEventListener("input", () => { playerNames[i] = input.value; });
    row.appendChild(input);
    if (playerNames.length > MIN_PLAYERS) {
      const remove = document.createElement("button");
      remove.className = "remove-btn";
      remove.type = "button";
      remove.textContent = "✕";
      remove.title = "Spieler entfernen";
      remove.onclick = () => removePlayer(i);
      row.appendChild(remove);
    }
    list.appendChild(row);
  });
  document.getElementById("addPlayerBtn").style.display =
    playerNames.length >= MAX_PLAYERS ? "none" : "";
}

function syncNamesFromInputs() {
  playerNames.forEach((_, i) => {
    const el = document.getElementById("p" + (i + 1));
    if (el) playerNames[i] = el.value;
  });
}

function addPlayer() {
  if (playerNames.length >= MAX_PLAYERS) return;
  syncNamesFromInputs();
  playerNames.push("");
  renderPlayers();
}

function removePlayer(idx) {
  if (playerNames.length <= MIN_PLAYERS) return;
  syncNamesFromInputs();
  playerNames.splice(idx, 1);
  renderPlayers();
}

function startGame() {
  syncNamesFromInputs();
  players = playerNames.map((n, i) => (n.trim() || ("Spieler " + (i + 1))));
  document.getElementById("setupScreen").classList.remove("active");
  document.getElementById("gameScreen").classList.add("active");
  round = 0;
  document.getElementById("counter").textContent = "Runde 1";
  layoutPlayers();
}

function layoutPlayers() {
  const wrap = document.getElementById("boardWrap");
  wrap.querySelectorAll(".player-label").forEach(n => n.remove());
  const n = players.length;
  const r = 45; // % radius from center
  players.forEach((name, i) => {
    const angle = (360 / n) * i;
    const rad = angle * Math.PI / 180;
    const top = 50 - r * Math.cos(rad);
    const left = 50 + r * Math.sin(rad);
    const el = document.createElement("div");
    el.className = "player-label";
    el.dataset.idx = i;
    el.style.top = top + "%";
    el.style.left = left + "%";
    el.textContent = name;
    wrap.appendChild(el);
  });
}

function spin() {
  if (isSpinning) return;
  isSpinning = true;
  round++;
  document.getElementById("counter").textContent = "Runde " + round;
  document.getElementById("spinBtn").disabled = true;
  document.querySelectorAll(".player-label").forEach(l => l.classList.remove("highlight"));

  const n = players.length;
  const winner = Math.floor(Math.random() * n);
  const segment = 360 / n;
  const targetAngle = winner * segment;
  const fullSpins = 4 + Math.floor(Math.random() * 3);
  const jitter = (Math.random() - 0.5) * Math.min(segment * 0.6, 50);
  const base = Math.floor(currentRotation / 360) * 360;
  currentRotation = base + fullSpins * 360 + targetAngle + jitter;

  const bottle = document.getElementById("bottle");
  bottle.style.transform = `translate(-50%, -50%) rotate(${currentRotation}deg)`;

  setTimeout(() => {
    document.querySelector(`.player-label[data-idx="${winner}"]`).classList.add("highlight");
    setTimeout(() => showCard(winner), 600);
  }, 4600);
}

function pickCategory() {
  // OFF: spicy rare (~10%) | ON: spicy dominant (~62%)
  const weights = spicyBoost
    ? { trinken: 1, wahrheit: 1, aufgabe: 1, spicy: 5 }
    : { trinken: 3, wahrheit: 3, aufgabe: 3, spicy: 1 };
  const entries = Object.entries(weights);
  const total = entries.reduce((s, [, w]) => s + w, 0);
  let r = Math.random() * total;
  for (const [cat, w] of entries) {
    if ((r -= w) < 0) return cat;
  }
  return "trinken";
}

  overlay.classList.add("active");

function resetGame() {
  if (!confirm("Neues Spiel starten? Aktuelle Runde geht verloren.")) return;
  round = 0;
  currentRotation = 0;
  document.getElementById("bottle").style.transition = "none";
  document.getElementById("bottle").style.transform = "translate(-50%, -50%) rotate(0deg)";
